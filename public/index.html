<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylos.css">
    <title>CRUD</title>
</head>
<body>
    <div id="contenedor">

        <div id="header">
           <h1>Crud de Agenda de contactos</h1>
        </div>

     <div class="main">

        <div id="Agenda">
            <p id="mensajeExito" class="oculto">contacto agregado correctamente</p>
             <form action="">
              

                    <div class="campo">
 
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre">
                    </div>

                     <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono">
                    </div>

                    <div class="campo">
                        <label for="gmail">Contacto</label>
                        <input type="text" id="gmail" placeholder="tucontacto@">
                    </div>

                    <div class="campo">
                        <label for="gmail">Referencia</label>
                        <input type="text" id="referencia" placeholder="EJ: Vecino, Amigo....">
                    </div>


                    <div id="botones">
                        <button type="submit" id="agregar">Agregar Contacto</button>
                        <button type="button" id="cancelar">Cancelar</button>
                    </div>
                
                </form>

        </div>
        <div id="buscadorContainer">
             <input type="text" id="inputBuscar" placeholder="Buscar...">
             <label><input type="checkbox" id="chkNombre" checked> Nombre</label>
             <label><input type="checkbox" id="chkReferencia" checked> Referencia</label>
        </div>
            
            <p id="contador"></p>


            <ul id="cosas">
            <li>NOMBRE</li>
            <li>TELEFONO</li>
            <li>contacto</li>   
            <li>Referencia</li>
            <li></li>
            </ul>



            <p id="mensajevacio" class="oculto">No hay contactos para mostrar.</p>
            <p id="cargando" class="oculto">Cargando contactos</p>
            <div id="listaContactos"></div>
    </div>

        <div class="footer"></div>

</div>

    <script src="js.js"></script>
</body>
</html>
